<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Resume</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        header, footer { text-align: center; }
        h1 { margin-bottom: 0; }
        .contact { margin-top: 0; }
        section { margin-bottom: 1.5em; }
        h2 { border-bottom: 1px solid #ccc; padding-bottom: 0.25em; }
    </style>
</head>
<body>
    <header>
        <h1>Lyuzichen</h1>
        <p class="contact">Email: example@example.com | Phone: 123-456-7890</p>
    </header>

    <section>
        <h2>Summary</h2>
        <p>Brief description or objective statement.</p>
    </section>

    <section>
        <h2>Education</h2>
        <ul>
            <li>School/University — Degree, Graduation Year</li>
        </ul>
    </section>

    <section>
        <h2>Experience</h2>
        <ul>
            <li>Job Title, Company — Years</li>
        </ul>
    </section>

    <section>
        <h2>Skills</h2>
        <ul>
            <li>Skill 1</li>
            <li>Skill 2</li>
        </ul>
    </section>

    <footer>
        <p>&copy; 2024 Lyuzichen</p>
    </footer>
</body>
</html>
